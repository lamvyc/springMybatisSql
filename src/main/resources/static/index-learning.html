  <!-- ============ 左侧：数据概览 + 阶段目录 ============ -->
  <div class="sidebar">
    <div class="side-sec">
      <div class="side-title">数据概览（mall_*）<span class="mini">示例手机号：<span class="phone-chip" id="samplePhone">…</span></span></div>

<script>
"use strict";
/* ============================================================
 * 常量：本教程所有可交互步骤（与 docs/mysql-index 各阶段一一对应）
 * 步骤类型：
 *   info : 只读说明
 *   run  : 一条可执行语句（SQL 里的 {{phone}} 会自动替换成你库里的真实手机号）
 * ============================================================ */
const API = '/api/index-demo';
const PHONE_PLACEHOLDER = '{{phone}}';
let SAMPLE_PHONE = '13713529579';

/* ---------------- 步骤数据 ---------------- */
const ORDER_COLS = 'id, order_no, user_id, status, pay_amount, create_time';
const Q_MY = `SELECT ${ORDER_COLS} FROM mall_order WHERE user_id = 29997 AND status = 1 ORDER BY create_time DESC LIMIT 20`;
const Q_ADMIN = `SELECT ${ORDER_COLS} FROM mall_order WHERE status = 1 AND create_time BETWEEN '2024-06-01 00:00:00' AND '2024-06-30 23:59:59' ORDER BY create_time DESC LIMIT 50`;
const Q_P_ALL = `SELECT * FROM mall_product WHERE category_id = 37 AND status = 1 ORDER BY price DESC LIMIT 20`;
const Q_P_LIGHT = `SELECT id, category_id, price, stock FROM mall_product WHERE category_id = 37 AND status = 1 ORDER BY price DESC LIMIT 20`;

const STAGES = [
/* ============================ 00 ============================ */
{
  id: '00', no: '00', name: '准备与造数', doc: 'docs/mysql-index/00-准备与造数.md', intro: '先有“量大到能看出差别”的业务表。注意：建表/造数必须在 MySQL 客户端做一次（页面安全上不允许删表重建），做完后本页概览会自动显示 30万/20万/100万 行。',
  banner: '还没造过数？在终端执行：<br><code>mysql -h127.0.0.1 -uroot -proot1234 sql_learning_platform &lt; docs/mysql-index/sql/00_建表与造数.sql</code>',
  steps: [
    { t: 'info', title: '为什么单独一套 mall_* 表？', desc: '原项目的 user/orders/product 只有几十行，仅供 SQL 实验台练习。<b>索引学习必须数据量大</b>，所以新建 mall_user / mall_product / mall_order（前缀 mall_ 与原表完全隔离，互不影响）。建表时<b>刻意只留主键 + 业务唯一索引</b>，让你从“没有二级索引”的状态开始学。' },
    { t: 'run', title: '看看三张表的行数与当前索引（应只有 PRIMARY / uk_*）', desc: '全表扫与索引的差别，只有在“百万行”上才看得出来。先确认数据就位、索引是初始态。', sql: 'SHOW INDEX FROM mall_user;' },
    { t: 'run', title: '订单状态分布（模拟真实业务：已支付最多）', desc: '数据看起来“像真实订单”，后面阶段 2 会证明 status 这种低区分度列为什么不适合单列索引。', sql: 'SELECT status, COUNT(*) AS cnt FROM mall_order GROUP BY status ORDER BY status;' },
    { t: 'run', title: '取一个真实手机号（下面每阶段都要用）', desc: '造数是随机的，每个人的号码不同。记下结果里的一个 phone，也可以直接复制页面右上角的“示例手机号”。', sql: 'SELECT username, phone FROM mall_user ORDER BY id LIMIT 5;' },
    { t: 'info', title: '本阶段总结', desc: '<b>学会了：</b>表结构刻意“没索引”；<b>日常：</b>大表才谈索引；<b>面试：</b>索引是空间换时间，小表/写多表别乱建。' }
  ]
},
/* ============================ 01 ============================ */
{
  id: '01', no: '01', name: '第一次使用索引', doc: 'docs/mysql-index/01-第一次使用索引.md',
  intro: '完整经历：没索引 → EXPLAIN → CREATE INDEX → 再 EXPLAIN。看懂 type / key / rows / Extra 四列 = 学会判断“索引有没有生效”。',
  reset: true,
  steps: [
    { t: 'info', title: '业务场景：后台“按手机号查用户”', desc: '客服在后台输入手机号查用户资料。SQL 只有一句 WHERE 等值，但 30 万行里怎么找？先别建索引，看 MySQL 最笨的方式。' },
    { t: 'run', title: '第 1 次查询（此刻 phone 没有索引）', desc: '能查到 1 行，但看不出“过程”。真正要看的是下面 EXPLAIN。', sql: `SELECT * FROM mall_user WHERE phone = '${PHONE_PLACEHOLDER}';` },
    { t: 'run', title: 'EXPLAIN：看 MySQL 是怎么找的（重点记下 type / key / rows）', desc: '', observe: '预期：type=ALL（全表扫）、key=NULL（没走索引）、rows≈299124（扫约 30 万行）、Extra=Using where。耗时约 60~80ms。', sql: `EXPLAIN SELECT * FROM mall_user WHERE phone = '${PHONE_PLACEHOLDER}';` },
    { t: 'info', title: '读 EXPLAIN 的 4 个最重要字段', desc: '<b>type</b>：访问类型，ALL=全表扫（最差）；<b>key</b>：真正用到的索引，NULL=没用上；<b>rows</b>：预估扫描行数（越小越好）；<b>Extra</b>：Using filesort=排序自己做（要警惕）。' },
    { t: 'run', title: 'CREATE INDEX 建索引', desc: '逐词：CREATE INDEX <b>索引名</b> ON <b>表</b>(<b>列</b>)。为什么建在 phone 上？① 它是高频 WHERE 条件；② 30 万里几乎每行不同（区分度极高）。', observe: '成功后，到左侧点“↻ 刷新概览”，user 表会多出 idx_user_phone。', sql: 'CREATE INDEX idx_user_phone ON mall_user (phone);' },
    { t: 'run', title: '同一句 SQL 再查一次', desc: '结果一样，但过程已经变了。', sql: `SELECT * FROM mall_user WHERE phone = '${PHONE_PLACEHOLDER}';` },
    { t: 'run', title: '再 EXPLAIN，逐字段对比', desc: '', observe: '预期：type=ref、key=idx_user_phone、rows=1。这就是“索引生效”的硬证据。', sql: `EXPLAIN SELECT * FROM mall_user WHERE phone = '${PHONE_PLACEHOLDER}';` },
    { t: 'info', title: '前后对比结论', desc: '建索引前：ALL / key=NULL / rows≈299124 / ~70ms → 建索引后：ref / idx_user_phone / rows=1 / ~20ms（含连接开销）。MySQL 现在走 idx_user_phone 这棵 B+ 树二分定位，再从叶子拿主键回表取完整行。<br><b>一句话记忆锚点：EXPLAIN 里 type 从 ALL 变 ref、rows 从 30 万变 1 —— 索引生效了。</b>' }
  ]
},
/* ============================ 02 ============================ */
{
  id: '02', no: '02', name: '单列索引', doc: 'docs/mysql-index/02-单列索引.md',
  intro: '回答 4 问：什么字段适合建索引（区分度）？主键/二级/唯一索引的区别？索引为什么快？为什么不是越多越好？',
  reset: true,
  steps: [
    { t: 'info', title: '两个对比实验：高区分度 vs 低区分度', desc: '给“高区分度”的 phone 建索引 vs 给“低区分度”的 status（全表只有 5 种取值）建索引，看优化器怎么选。' },
    { t: 'run', title: '高区分度：phone（30 万里几乎一个值）', desc: '先建索引（若刚点过“回到初始态”，此时必然可建）。', sql: 'CREATE INDEX idx_user_phone ON mall_user (phone);' },
    { t: 'run', title: 'EXPLAIN：phone 等值查询', desc: '', observe: '预期：ref / idx_user_phone / rows=1。30 万选 1 → 索引定位 1 行。', sql: `EXPLAIN SELECT * FROM mall_user WHERE phone = '${PHONE_PLACEHOLDER}';` },
    { t: 'run', title: '低区分度：先看 status 的真实分布', desc: 'status 只有 5 种取值，其中 status=1（已支付）占了约一半。', sql: 'SELECT status, COUNT(*) AS cnt FROM mall_order GROUP BY status;' },
    { t: 'run', title: '给 status 建索引，再 EXPLAIN status=1', desc: '', observe: '预期：ref / idx_order_status / rows≈498125（约 50 万行！）。索引“被用了”但等于翻半张表，若 SELECT * 还要几十万次回表——并不比全表扫划算。这就是“低区分度列不适合单列索引”。', sql: 'CREATE INDEX idx_order_status ON mall_order (status);' },
    { t: 'run', title: 'EXPLAIN：status=0（约 10 万行）', desc: '比例小一些，但仍是“几十万行”量级。', sql: 'EXPLAIN SELECT * FROM mall_order WHERE status = 0;' },
    { t: 'run', title: '演示完删掉低区分度索引（留着无益）', desc: '', sql: 'DROP INDEX idx_order_status ON mall_order;' },
    { t: 'info', title: '三种索引形态（都在本工程里）', desc: '<b>主键索引</b>：建表 PRIMARY KEY 自动生成，InnoDB 表数据按它组织；<b>唯一索引</b>：UNIQUE KEY 自动生成（username / order_no）；<b>二级索引</b>：CREATE INDEX 手建（phone）。下方三条 SQL 逐一验证。' },
    { t: 'run', title: 'EXPLAIN：主键等值 id = 137', desc: '', observe: '预期：type=const（按主键定位，理论最快）。', sql: 'EXPLAIN SELECT * FROM mall_user WHERE id = 137;' },
    { t: 'run', title: 'EXPLAIN：主键范围 id BETWEEN', desc: '', observe: '预期：type=range，一次定位起点向后取 101 行。', sql: 'EXPLAIN SELECT * FROM mall_user WHERE id BETWEEN 100 AND 200;' },
    { t: 'run', title: 'EXPLAIN：唯一索引等值 username', desc: '', observe: '预期：type=const / key=uk_username。唯一索引等值 = 最多 1 行。', sql: "EXPLAIN SELECT * FROM mall_user WHERE username = 'user_123';" },
    { t: 'info', title: '索引为什么快？（机制图）', desc: '没索引 = 30 万行一行行翻（O(N)）；有索引 = 在按列排好序的 B+ 树上自顶向下二分，3~4 层就定位到叶子页（O(logN)），再顺着叶子链表取目标行。<br>type 总排序：<code>const &gt; ref &gt; range &gt; index &gt; ALL</code>。' },
    { t: 'info', title: '为什么不是越多越好？（用数字说话）', desc: '每个索引都要为整张表“另存一份有序目录”：① 占磁盘/内存；② 每次 INSERT/UPDATE/DELETE 都要同步维护每一棵 B+ 树（写放大）。下方现场演示空间成本。' },
    { t: 'run', title: '在 100 万行订单上建一个单列索引', desc: '建完去左侧点“↻ 刷新概览”，对比 mall_order 的“索引体积”变化。', observe: '实测：仅主键+唯一索引时索引约 26.6MB；每加一个联合索引约多 26MB。索引真的是要“花钱”的。', sql: 'CREATE INDEX idx_user_id ON mall_order (user_id);' },
    { t: 'run', title: '删掉它，继续学习', desc: '', sql: 'DROP INDEX idx_user_id ON mall_order;' }
  ]
},

{

    { t: 'run', title: '业务 SQL：分类 37 的上架商品列表（共 847 个）', desc: '', sql: "SELECT COUNT(*) AS cnt FROM mall_product WHERE category_id = 37 AND status = 1;" },

    { t: 'run', title: 'EXPLAIN SELECT *（三列索引已建）', desc: '', observe: '预期：ref / rows≈847 / Backward index scan（排序省了）——但 Extra 里【没有 Using index】：product_name、create_time 不在索引里，仍要回表。', sql: `EXPLAIN ${Q_P_ALL};` },
    { t: 'run', title: 'EXPLAIN 只查 4 列（其中 stock 不在索引）——还是回表', desc: '只要有一个需要的列不在索引里，回表就跑不掉。', observe: '预期：和上一步几乎一样（没有 Using index）。', sql: `EXPLAIN ${Q_P_LIGHT};` },
    { t: 'run', title: '第 3 步：把 stock 也“塞进”索引', desc: '把要返回的列加入索引 → 覆盖索引。', sql: 'DROP INDEX idx_cat_status_price ON mall_product;' },

    { t: 'run', title: 'EXPLAIN 只查索引里有的列 —— Using index 出现了！', desc: '', observe: '预期：Extra=Backward index scan; Using index。“Using index”=覆盖索引=不用回表。id 为什么免费？二级索引叶子自带主键。', sql: `EXPLAIN ${Q_P_LIGHT};` },

/* ---------------- 基础工具 ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fillPhone(sql) { return sql.split(PHONE_PLACEHOLDER).join(SAMPLE_PHONE); }

function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 2600);
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  return r.json();
}

/* ---------------- 数据概览 ---------------- */
async function refreshState(silent) {
  const box = $('#stateBox');
  try {
    const resp = await (await fetch(API + '/state')).json();
    if (resp.code !== 200) throw new Error(resp.message || 'state 加载失败');
    const data = resp.data;
    SAMPLE_PHONE = data.samplePhone || SAMPLE_PHONE;
    const sp = $('#samplePhone');
    if (sp) sp.textContent = SAMPLE_PHONE;
    if (!data.tables || !data.tables.length) { box.innerHTML = '<div class="empty-tip">还没有 mall_* 表，请先造数（见阶段00）。</div>'; return; }
    box.innerHTML = data.tables.map(t => {
      const idxHtml = (t.indexes && t.indexes.length)
        ? t.indexes.map(i => '<span class="idx-tag ' + clsOf(i.name) + '">' + esc(i.name) + '(' + esc(i.columns.join(',')) + ')</span>').join('')
        : '<span class="empty-tip">无二级索引</span>';
      return '<div class="tbl-card"><div class="head"><b>' + esc(t.table) + '</b>' +
        '<span class="idx-tag pk">' + esc(fmtNum(t.rows)) + ' 行</span></div>' +
        '<div class="rows">数据 ' + (t.dataMb ?? '-') + 'MB · 索引 ' + (t.idxMb ?? '-') + 'MB</div>' +
        '<div class="idx-tags">' + idxHtml + '</div></div>';
    }).join('');
    if (!silent) toast('概览已刷新');
  } catch (e) {
    box.innerHTML = '<div class="err-box">数据概览加载失败：' + esc(e.message) + '</div>';
  }
}
function clsOf(name) {
  if (/^PRIMARY$/i.test(name)) return 'pk';
  if (/^uk_/i.test(name)) return 'uk';
  return '';
}
function fmtNum(n) {
  const v = Number(n); if (!isFinite(v)) return String(n ?? '-');
  return v >= 10000 ? (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + ' 万' : String(v);
}

async function resetAll() {
  const btn = $('#btnReset');
  btn.disabled = true;
  try {
    const resp = await post(API + '/reset-indexes', {});
    if (resp.code !== 200) throw new Error(resp.message || '重置失败');
    const list = resp.data || [];
    toast('已回到初始态，删除了 ' + list.length + ' 个本教程索引');
    await refreshState(true);
  } catch (e) {
    toast('重置失败：' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

/* ---------------- 左侧阶段导航 ---------------- */
function renderNav(activeId) {
  $('#stageNav').innerHTML = STAGES.map(s =>
    '<div class="stage-item' + (s.id === activeId ? ' active' : '') + '" data-id="' + s.id + '">' +
      '<div class="stage-no">' + s.no + '</div>' +
      '<div class="txt"><div class="t">' + esc(s.name) + '</div>' +
      '<div class="d">' + (s.doc ? s.doc.replace(/^docs\/mysql-index\//, '') : '') + '</div></div>' +
    '</div>').join('');
  $$('#stageNav .stage-item').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id;
      location.hash = 'stage-' + id;
      renderStage(id);
    });
  });
}

/* ---------------- 右侧：渲染一个阶段 ---------------- */
function renderStage(id) {
  const stage = STAGES.find(s => s.id === id) || STAGES[0];
  renderNav(id);
  const st = stage.steps.map((s, i) => stepHtml(stage, s, i + 1)).join('');

  const resetBtn = stage.reset
    ? '<button class="btn btn-blue" data-reset-stage>① 先回到初始态</button>'
      + '<span class="hint">推荐每阶段开始前点一次（只删教程二级索引，不删数据）</span>'
    : '';

  $('#main').innerHTML =
    '<div class="stage-head">' +
      '<h2>阶段 ' + stage.no + ' · ' + esc(stage.name) + '</h2>' +
      (stage.doc ? '<div class="doc">📄 配套文档：' + esc(stage.doc) + '（仓库内，可对照细读）</div>' : '') +
      '<p>' + esc(stage.intro) + '</p>' +
      (stage.banner ? '<div class="banner warn">' + stage.banner + '</div>' : '') +
      '<div class="stage-tools">' + resetBtn + '<button class="btn btn-ghost" id="refreshTop">↻ 刷新概览</button></div>' +
    '</div>' +
    (stage.id === '00' ? '<div class="banner">从哪开始？推荐顺序 00→01→…→06。<b>没头绪就先点“阶段01”，按卡片从上到下执行</b>，每步看右边返回结果与“观察点”。</div>' : '') +
    st +
    '<div class="footer-note">以上结果均为本机 MySQL 真实执行。SQL 可自由修改后重跑（例如把 userId=29997 换成左侧概览里其他用户）。' +
    ' 学习过程中随时点左侧“回到初始态”重来。' +
    (stage.doc ? ' 完整图文讲解与面试表达见 ' + esc(stage.doc) + '。' : '') + '</div>';
}

function stepHtml(stage, s, idx) {
  if (s.t === 'info') {
    return '<div class="step"><div class="s-head"><div class="s-no">✓</div><div class="s-title">' + esc(s.title) + '</div></div>' +
      '<div class="s-body"><div class="s-desc">' + s.desc + '</div></div></div>';
  }
  const area = s.sql ? '<textarea class="sql-area" data-sql-area spellcheck="false">' + esc(fillPhone(s.sql)) + '</textarea>' : '';
  return '<div class="step">' +
    '<div class="s-head"><div class="s-no">' + idx + '</div><div class="s-title">' + esc(s.title) + '</div></div>' +
    '<div class="s-body">' +
      (s.desc ? '<div class="s-desc">' + s.desc + '</div>' : '') +
      (s.observe ? '<div class="observe">👀 观察点：' + s.observe + '</div>' : '') +
      area +
      '<div class="s-actions">' +
        '<button class="btn btn-blue" data-run>▶ 运行</button>' +
        '<button class="btn btn-ghost" data-copy>复制</button>' +
        '<span class="spent"></span>' +
      '</div>' +
      '<div class="res"></div>' +
    '</div></div>';
}

/* ---------------- 步骤运行 ---------------- */
async function runStep(btn) {
  const stepEl = btn.closest('.step');
  const area = stepEl.querySelector('[data-sql-area]');
  const sql = area ? area.value.trim() : '';
  if (!sql) { toast('SQL 为空', true); return; }
  const res = stepEl.querySelector('.res');
  const spent = stepEl.querySelector('.spent');
  const copyBtn = stepEl.querySelector('[data-copy]');

  btn.disabled = true;
  res.innerHTML = '<div class="err-box" style="background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;">⏳ 执行中…（100万行表的全表扫可能需要几百毫秒，请稍候）</div>';
  spent.textContent = '';
  try {
    const resp = await post(API + '/run', { sql });
    if (resp.code !== 200) throw new Error(resp.message || '请求失败');
    const d = resp.data;
    spent.textContent = '执行耗时 ' + (d.elapsedMs ?? '-') + ' ms';
    if (!d.ok) {
      res.innerHTML = '<div class="err-box">❌ ' + esc(d.errorMessage) + '</div>';
      return;
    }
    if (d.kind === 'query') {
      res.innerHTML = queryResultHtml(d);
    } else {
      res.innerHTML = '<div class="ok-box">✅ 执行成功（' + (d.elapsedMs ?? '-') + ' ms）—— 索引已变更，自动刷新左侧概览</div>';
      refreshState(true);
    }
  } catch (e) {
    res.innerHTML = '<div class="err-box">❌ ' + esc(e.message) + '</div>';
  } finally {
    btn.disabled = false;
    if (copyBtn) { /* noop */ }
  }
}

/* 结果渲染：普通表 / EXPLAIN 解读 / SHOW INDEX */
function queryResultHtml(d) {
  const rows = d.rows || [];
  const cols = orderColumns(d.columns || [], rows);
  let chips = '';
  if (cols.includes('type') && rows.length) {
    const r = rows[0];
    const extraS = String(r.Extra || '');
    const isCover = /Using index/i.test(extraS) && !/Using index condition/i.test(extraS);
    chips = '<div class="explain-chips">' +
      chip('type', r.type, 'type-' + String(r.type)) +
      chip('key', r.key, r.key ? 'good' : 'bad') +
      chip('rows', r.rows, '') +
      chip('extra', r.Extra, /filesort|temporary/i.test(extraS) ? 'bad' : (isCover ? 'good' : '')) +
      '</div>';
  }
  if (!rows.length) {
    return chips + '<div class="ok-box">✅ 查询成功，返回 0 行</div>';
  }
  let head = '<tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
  let body = rows.slice(0, 300).map(row =>
    '<tr>' + cols.map(c => '<td class="num">' + esc(cell(row[c])) + '</td>').join('') + '</tr>').join('');
  let cap = '<div class="ok-box">✅ 查询成功：' + rows.length + ' 行' + (rows.length > 300 ? '（仅显示前 300 行）' : '') + '</div>';
  return chips + cap + '<div class="tbl-wrap"><table>' + head + body + '</table></div>';
}
function chip(label, val, cls) {
  return '<span class="chip ' + cls + '"><b>' + esc(String(val ?? 'NULL')) + '</b></span>';
}
function cell(v) {
  if (v === null || v === undefined) return 'NULL';
  if (typeof v === 'object') {
    if (v instanceof Date) return v.toLocaleString();
    return JSON.stringify(v);
  }
  return v;
}
function orderColumns(cols, rows) {
  if (!cols.length && rows.length) cols = Object.keys(rows[0]);
  if (cols.includes('type')) {
    const order = ['id','select_type','table','partitions','type','possible_keys','key','key_len','ref','rows','filtered','Extra'];
    const rest = cols.filter(c => !order.includes(c)).sort();
    return order.filter(c => cols.includes(c)).concat(rest);
  }
  if (cols.includes('Key_name')) {
    const order = ['Table','Non_unique','Key_name','Seq_in_index','Column_name','Collation','Cardinality','Sub_part','Packed','Null','Index_type','Comment'];
    const rest = cols.filter(c => !order.includes(c));
    return order.filter(c => cols.includes(c)).concat(rest);
  }
  return cols.slice().sort((a, b) => a.localeCompare(b));
}

/* ---------------- 全局事件 ---------------- */
$('#main').addEventListener('click', async ev => {
  const runBtn = ev.target.closest('[data-run]');
  if (runBtn) { runStep(runBtn); return; }
  const copyBtn = ev.target.closest('[data-copy]');
  if (copyBtn) {
    const area = copyBtn.closest('.step').querySelector('[data-sql-area]');
    if (area) {
      try { await navigator.clipboard.writeText(area.value); toast('已复制 SQL'); }
      catch (e) { area.select(); document.execCommand('copy'); toast('已复制 SQL'); }
    }
    return;
  }
  if (ev.target.closest('[data-reset-stage]')) { resetAll(); return; }
  if (ev.target.closest('#refreshTop')) { refreshState(); return; }
});
$('#btnRefresh').addEventListener('click', () => refreshState());
$('#btnReset').addEventListener('click', resetAll);

/* ---------------- 启动 ---------------- */
(async function boot() {
  const target = (location.hash.match(/stage-(\d+)/) || [])[1] || '00';
  renderStage(target);
  await refreshState(true);
})();
</script>
